name: Build ServiceProvider

on:
  push:
    branches: [main, develop]
    paths:
      - "ServiceProvider/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "ServiceProvider/**"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build ServiceProvider
        working-directory: ServiceProvider
        run: mvn clean package -DskipTests

      - name: Extract final JAR
        run: |
          mkdir -p output/ServiceProvider
          # Wir schließen "original-" JARs aus, falls du das Maven Shade Plugin benutzt
          find ServiceProvider/target/ -maxdepth 1 -name "*.jar" ! -name "original-*.jar" -exec cp {} output/ServiceProvider/ \;

      - name: Upload ServiceProvider artifact
        uses: actions/upload-artifact@v4
        with:
          name: ServiceProvider-Plugin
          path: output/ServiceProvider/*.jar
          retention-days: 5
          if-no-files-found: error
